<style>
:root{--y:#F4CE00;--y2:#FFF4B8;--m:#E6007E;--m2:#fde0ef;--ink:#111113;--ink2:#1c1c20;--bg:#F6F4EE;--card:#fff;--mut:#666670;--line:#ececf0;--ok:#0f9d58;--warn:#d98f00;--bad:#d92d4b;--r:22px;--sh:0 1px 2px rgba(17,17,19,.04),0 8px 30px rgba(17,17,19,.06);--sw:264px}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
a{color:inherit}
:focus-visible{outline:3px solid var(--m);outline-offset:2px}
h1{font-size:26px;letter-spacing:-.6px;font-weight:780;line-height:1.1}
h2{font-size:17px;letter-spacing:-.2px;font-weight:700}
h3{font-size:14px;font-weight:650}
.sub{color:var(--mut);font-size:14px}.mut{color:var(--mut)}.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}.b{font-weight:700}
.sr{position:absolute;left:-9999px}
.lbl{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);font-weight:600}
.dark .lbl,.pink .lbl{color:rgba(255,255,255,.7)}.yel .lbl{color:rgba(17,17,19,.62)}
/* botones y formularios */
.btn{display:inline-flex;gap:8px;align-items:center;justify-content:center;border:0;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;cursor:pointer;font-weight:650;min-height:44px;text-decoration:none;white-space:nowrap;text-align:center;line-height:1.2}
.btn:hover{filter:brightness(1.15)}
.btn.y{background:var(--y);color:var(--ink)}.btn.m{background:var(--m)}.btn.g{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.wa{background:#1fa855}.btn.bad{background:var(--bad)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:13px}
.btn.lg{min-height:52px;font-size:16px;padding:12px 24px}
.btn[disabled],.btn.off{opacity:.4;pointer-events:none}
.btn kbd{font:600 11px ui-monospace,Consolas,monospace;background:rgba(0,0,0,.14);border-radius:6px;padding:1px 6px}
.btn.g kbd,.btn.y kbd{background:rgba(0,0,0,.08)}
.ib{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
label{display:block;font-size:12px;font-weight:650;color:var(--mut);margin:12px 0 5px;letter-spacing:.3px}
input,select,textarea{width:100%;border:1px solid #dcdce4;border-radius:14px;padding:11px 14px;background:#fff;min-height:46px}
textarea{min-height:90px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto;min-height:0}
input[type=file]{padding:9px}
.sel{border:1px solid var(--line);background:#fff;border-radius:14px;padding:9px 12px;min-height:44px;max-width:100%;width:auto}
.g2{display:grid;gap:0 14px;grid-template-columns:1fr}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 15px;cursor:pointer;font-size:13px;font-weight:650;min-height:38px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:650;background:#eee;color:#444;white-space:nowrap}
.badge.ok{background:#dff5e8;color:#0a6b3a}.badge.warn{background:#fff0c7;color:#8a5a00}.badge.bad{background:#fde0e5;color:#a3122c}.badge.m{background:var(--m2);color:#a30060}.badge.dk{background:var(--ink);color:#fff}
/* layout panel */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:min(86vw,300px);background:var(--ink);color:#e9e9ee;z-index:40;transform:translateX(-102%);transition:transform .25s;display:flex;flex-direction:column;padding:20px 14px;overflow:auto}
.side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 20px}
.logo{width:44px;height:44px;border-radius:14px;background:var(--y);display:grid;place-items:center;font-weight:900;color:var(--ink);font-size:20px;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:cover}
.brand b{display:block;font-size:15px;color:#fff}.brand small{color:#9a9aa6;font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;gap:12px;align-items:center;background:none;border:0;color:#c1c1cc;padding:11px 12px;border-radius:14px;cursor:pointer;text-align:left;white-space:nowrap;min-height:44px}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:var(--y);color:var(--ink);font-weight:650}
.nav .sep{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#777784;padding:16px 12px 6px}
.side .credit{margin-top:auto;padding:16px 8px 4px;font-size:11px;color:#8a8a96;line-height:1.4}
.side .credit a{color:var(--y)}
.main{min-width:0;display:flex;flex-direction:column;min-height:100vh}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(246,244,238,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
#view{padding:18px 16px 28px;width:100%;max-width:1480px;margin:0 auto;flex:1}
.ph{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.bento{display:grid;grid-template-columns:1fr;gap:14px}
.c{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--sh);border:1px solid rgba(17,17,19,.04);min-width:0}
.c.dark{background:var(--ink);color:#fff}.c.yel{background:var(--y)}.c.pink{background:var(--m);color:#fff}
.kpi{font-size:32px;font-weight:800;letter-spacing:-1.2px;line-height:1.05;margin:8px 0 2px;overflow-wrap:anywhere}
.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:var(--mut);text-align:left;padding:10px 12px;font-weight:600;white-space:nowrap}
td{padding:12px;border-top:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#fbfaf6}
td.r,th.r{text-align:right}
.act{display:flex;gap:6px;flex-wrap:wrap}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.li:first-child{border-top:0}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.pc{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;display:flex;flex-direction:column;min-width:0}
.pc .im{aspect-ratio:1/1;background:linear-gradient(135deg,var(--y2),#ffd9ec);display:grid;place-items:center;font-size:34px;font-weight:800;color:rgba(17,17,19,.25);overflow:hidden}
.pc .im img{width:100%;height:100%;object-fit:cover}
.pc .bd{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.pc.sel1{outline:3px solid var(--m)}
.kan{display:grid;grid-template-columns:1fr;gap:12px}
.col{background:#efece3;border-radius:18px;padding:12px;min-height:120px}
.col.over{outline:2px dashed var(--m)}
.card{background:#fff;border-radius:14px;padding:12px;margin-top:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:grab}
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:360px}
.st{aspect-ratio:1;border-radius:50%;border:2px dashed #ccc;display:grid;place-items:center;font-weight:800;color:#bbb}
.st.f{background:var(--y);border:2px solid var(--ink);color:var(--ink)}
.tok{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all}
pre{background:#0e0e10;color:#e6e6ea;padding:14px;border-radius:14px;overflow:auto;font-size:12px;max-height:280px}
.legal{max-height:420px;overflow:auto;font-size:14px;color:#333}.legal h3{margin:14px 0 4px}
.notice{background:var(--y2);border:1px solid #f0dc7a;border-radius:16px;padding:12px 16px;font-size:14px;margin-bottom:16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.notice.bad{background:#fde0e5;border-color:#f3b4c0}
/* POS */
.pos{display:grid;gap:14px;grid-template-columns:1fr}
.fbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:8px}.fbar .btn{white-space:normal;line-height:1.15}
.line{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:10px;border:2px solid transparent;border-radius:14px;cursor:pointer;background:#faf9f5;margin-top:8px}
.line.on{border-color:var(--m);background:#fff}
.line .nm{font-weight:650}
.sw{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px;background:#eee;color:#555}
/* modal / toast */
.modal{position:fixed;inset:0;z-index:80;background:rgba(17,17,19,.58);display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal[hidden]{display:none}
.mb{background:#fff;border-radius:26px 26px 0 0;padding:22px;width:100%;max-width:660px;max-height:92vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;z-index:99;font-size:14px;max-width:92vw;box-shadow:var(--sh)}
.fab{position:fixed;right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;background:var(--m);color:#fff;border:0;display:grid;place-items:center;box-shadow:0 10px 30px rgba(230,0,126,.4);cursor:pointer;z-index:35}
/* teclado numérico */
.npd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.npd button{min-height:60px;border-radius:16px;border:1px solid var(--line);background:#faf9f5;font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer}
.npd button:active{background:var(--y)}
.npv{font-size:34px;font-weight:800;text-align:center;padding:14px;background:#faf9f5;border-radius:16px;min-height:72px;display:flex;align-items:center;justify-content:center;letter-spacing:-1px}
.npv.empty{font-size:18px;font-weight:600;color:var(--mut);letter-spacing:0}
/* login */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--y);position:relative;overflow:hidden}
.auth::before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.35),transparent 40%),radial-gradient(circle at 85% 80%,rgba(230,0,126,.18),transparent 45%)}
.auth .c{position:relative;max-width:440px;width:100%;padding:28px}
.rc{font:700 20px ui-monospace,Consolas,monospace;letter-spacing:2px;text-align:center;background:var(--ink);color:var(--y);border-radius:16px;padding:16px;word-break:break-word}
/* sitio público */
.pub{background:var(--bg)}
.pbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(17,17,19,.92);backdrop-filter:blur(12px);color:#fff}
.pbar .logo{width:40px;height:40px;border-radius:12px}
.pbar b{font-size:15px}
.pbar .ib{background:transparent;border-color:rgba(255,255,255,.25);color:#fff}
.pbar .btn.g{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.hero{background:var(--y);position:relative;overflow:hidden;padding:30px 16px 36px}
.hero::after{content:"";position:absolute;inset:0;background:repeating-radial-gradient(ellipse at 90% 10%,transparent 0 46px,rgba(0,0,0,.045) 46px 60px);pointer-events:none}
.hero .in{position:relative;z-index:1;max-width:1180px;margin:0 auto;display:grid;gap:22px}
.hero h1{font-size:40px;letter-spacing:-1.8px;line-height:.98}
.hero h1 em{font-style:normal;color:var(--m)}
.hero .lg-img{width:min(280px,70vw);border-radius:30px;box-shadow:0 20px 50px rgba(0,0,0,.2);transform:rotate(-3deg)}
.psec{max-width:1180px;margin:0 auto;padding:26px 16px}
.pcard{background:#fff;border-radius:22px;overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;min-width:0;border:1px solid rgba(17,17,19,.05)}
.pcard .im{aspect-ratio:1/1;background:#111;overflow:hidden;cursor:pointer}
.pcard .im.tall{aspect-ratio:2/3}
.pcard .im img{width:100%;height:100%;object-fit:cover;display:block}
.pcard .bd{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.pcard .pr{font-size:20px;font-weight:800;letter-spacing:-.5px}
.pcard h3{font-size:15px;line-height:1.25}
.cartbar{position:fixed;left:12px;right:84px;bottom:12px;z-index:36;background:var(--ink);color:#fff;border-radius:999px;padding:8px 8px 8px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 12px 34px rgba(0,0,0,.3)}
.pfoot{background:var(--ink);color:#c6c6cf;padding:34px 16px 90px;margin-top:30px}
.pfoot .fg{display:grid;gap:22px;grid-template-columns:1fr;max-width:1180px;margin:0 auto}
.pfoot h4{color:#fff;font-size:13px;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:10px}
.pfoot a{color:var(--y);text-decoration:none}.pfoot small{color:#8e8e99}
.qrbox{background:#fff;padding:12px;border-radius:18px;display:inline-block;line-height:0}
/* ticket */
.ticket{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;width:100%;max-width:302px;margin:0 auto;color:#000;background:#fff;padding:8px}
.ticket hr{border:0;border-top:1px dashed #000;margin:6px 0}
.ticket .c2{text-align:center}.ticket .rw{display:flex;justify-content:space-between;gap:6px}
.ticket .nv{font-weight:700;text-align:center;border:1px solid #000;padding:4px;margin:6px 0}
@media (min-width:768px){
 h1{font-size:32px}
 .bento{grid-template-columns:repeat(6,1fr);gap:16px}
 .s3,.s4{grid-column:span 3}.s6,.s8,.s12{grid-column:span 6}
 .g2{grid-template-columns:1fr 1fr}
 .pgrid{grid-template-columns:repeat(3,1fr)}
 .kan{grid-template-columns:repeat(2,1fr)}
 .modal{align-items:center;padding:20px}.mb{border-radius:26px}
 #view{padding:26px 28px 36px}.top{padding:12px 28px}
 .hero{padding:48px 28px 56px}.hero .in{grid-template-columns:1.3fr 1fr;align-items:center}.hero h1{font-size:56px}
 .psec{padding:34px 28px}
 .pfoot{padding:44px 28px 90px}.pfoot .fg{grid-template-columns:1.4fr 1fr 1fr}
 .pbar{padding:12px 28px}
 .cartbar{left:auto;right:84px;width:420px}
}
@media (min-width:1024px){
 .app{grid-template-columns:var(--sw) minmax(0,1fr)}
 .side{position:sticky;top:0;height:100vh;transform:none;width:var(--sw);box-shadow:none!important}
 .app.col{grid-template-columns:84px minmax(0,1fr)}.app.col .side{width:84px}
 .app.col .brand div,.app.col .nav span,.app.col .nav .sep,.app.col .credit{display:none}
 .app.col .nav button{justify-content:center}
 #burger{display:none}
 .bento{grid-template-columns:repeat(12,1fr)}
 .s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}.s8{grid-column:span 8}.s12{grid-column:span 12}
 .kan{grid-template-columns:repeat(4,1fr)}
 .pos{grid-template-columns:1.5fr 1fr}
 .hero h1{font-size:72px}
}
@media (min-width:1440px){
 #view{padding:34px 48px 48px}.top{padding:14px 48px}
 .pgrid{grid-template-columns:repeat(4,1fr)}.kpi{font-size:40px}
 .psec,.pfoot .fg,.hero .in{max-width:1320px}
}
#ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (max-width:767px){#usr{display:none}.top{gap:6px;padding:8px 10px}.top .ib{width:40px;height:40px}.top .badge{font-size:11px;padding:3px 8px}}
#colbtn{display:none}.posbar{left:12px;right:12px;width:auto}
@media (min-width:1024px){#colbtn{display:grid}.posbar{display:none}}
@media (max-width:480px){.btn{white-space:normal;line-height:1.2}}
@media (max-width:400px){.top [data-a=help]{display:none}}
@media (max-width:360px){h1{font-size:23px}.btn{padding:9px 14px}.kpi{font-size:27px}.hero h1{font-size:34px}}
body.touch .btn,body.touch .chip,body.touch .nav button{min-height:48px}
body.kiosk .side,body.kiosk .top{display:none}body.kiosk .app{grid-template-columns:minmax(0,1fr)}
@media print{body *{visibility:hidden}.printable,.printable *{visibility:visible}.printable{position:absolute;left:0;top:0;width:100%}.no-p{display:none!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

<noscript><div style="padding:24px;font-family:sans-serif"><h1>Medicinal Terps</h1><p>Organización Cannábica Medicinal de Salta · Las Palmeras 90, Barrio Tres Cerritos, Salta Capital.</p><p>Este sitio necesita JavaScript.</p></div></noscript>
<script>
(function(){
'use strict';
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript

// Copyright (c) 2009 Kazuhiko Arase

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);

let IDB=null,MEMKV={},KVOK=true;
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open('terps_sys',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{IDB=r.result;res(true)};r.onerror=()=>res(false);r.onblocked=()=>res(false)}catch(e){res(false)}})}
function kvGet(k){return new Promise(res=>{if(!IDB)return res(MEMKV[k]);try{const q=IDB.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined)}catch(e){res(MEMKV[k])}})}
function kvSet(k,v){return new Promise(res=>{if(!IDB){MEMKV[k]=v;return res(true)}try{const tx=IDB.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);tx.onabort=()=>res(false)}catch(e){MEMKV[k]=v;res(false)}})}
function kvClear(){return new Promise(res=>{MEMKV={};if(!IDB)return res();try{const tx=IDB.transaction('kv','readwrite');tx.objectStore('kv').clear();tx.oncomplete=()=>res();tx.onerror=()=>res()}catch(e){res()}})}

const te=new TextEncoder(),td=new TextDecoder();
const b64=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64u=u=>b64(u).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const hex=u=>Array.from(u).map(b=>pad2(b)).join('');const pad2=b=>b.toString(16).padStart(2,'0');
async function kdf(pass,salt){const k=await crypto.subtle.importKey('raw',te.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function aesE(key,bytes){const iv=rnd(12);return{iv:b64(iv),ct:b64(new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes)))}}
async function aesD(key,o){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},key,unb64(o.ct)))}
const dkFrom=raw=>crypto.subtle.importKey('raw',raw,'AES-GCM',true,['encrypt','decrypt']);
async function wrapDK(pass,raw){const salt=rnd(16);const k=await kdf(pass,salt);const e=await aesE(k,raw);return{salt:b64(salt),iv:e.iv,ct:e.ct}}
async function unwrapDK(pass,w){const k=await kdf(pass,unb64(w.salt));return aesD(k,w)}
async function sha256hex(str){return hex(new Uint8Array(await crypto.subtle.digest('SHA-256',te.encode(str))))}

function numpad(o){NP={v:(o.initial==null||o.initial==='')?'':String(o.initial).replace('.',','),first:true,dec:o.dec!==false,ok:o.ok,title:o.title||'Número',unit:o.unit||'',max:o.max};npRender()}
function npRender(){
 const keys=['1','2','3','4','5','6','7','8','9',NP.dec?',':'','0','⌫'];
 modal('<h2>'+esc(NP.title)+'</h2><div class="npv'+(NP.v?'':' empty')+'" id="npv">'+(NP.v?esc(NP.v)+(NP.unit?' <small style="font-size:18px;margin-left:6px">'+esc(NP.unit)+'</small>':''):'Escribí el número')+'</div><div class="npd">'+keys.map(k=>k?'<button type="button" data-a="np" data-k="'+k+'">'+k+'</button>':'<span></span>').join('')+'</div><div class="row"><button class="btn g sp" data-a="np" data-k="C">Borrar todo</button><button class="btn g sp" data-a="mclose">Cancelar</button><button class="btn y sp" data-a="np" data-k="OK">Listo</button></div>',{nofocus:true})}
function npKey(k){
 if(!NP)return;
 if(k==='OK'){const n=parseNum(NP.v);if(isNaN(n)){toast('Escribí el número');return}const f=NP.ok,rv=NP.v;closeModal();f(n,rv);return}
 if(k==='C'){NP.v='';NP.first=false}
 else if(k==='⌫'){NP.v=NP.v.slice(0,-1);NP.first=false}
 else if(k===','){if(!NP.dec)return;if(NP.first)NP.v='';NP.first=false;if(!NP.v)NP.v='0';if(!NP.v.includes(','))NP.v+=','}
 else{if(NP.first){NP.v='';NP.first=false}if(NP.v.replace(/\D/g,'').length>10)return;NP.v+=k}
 npRender()}

 if(p.status==='discontinuado')return toast('Producto discontinuado');

 else{const n=q||1;if(!p.service&&posQtyInCart(p.id,-1)+n>p.stock)return toast('Stock disponible: '+qty(p.stock,p.unit));POS.lines.push({pid:p.id,name:p.name,unit:p.unit,qty:n,price:p.price,list:p.price,cost:p.cost||0,amount:r2(n*p.price),svc:!!p.service,mem:!!p.membership});POS.sel=POS.lines.length-1}

function posScan(code){
 code=String(code).trim();if(!code)return false;
 let p=S.products.find(x=>x.barcode&&x.barcode===code);
 if(p){p.unit==='g'?A.posAdd({dataset:{id:p.id}}):posAdd(p,1);return true}
 const m=code.match(/^2(\d{5})(\d{5})\d$/);
 if(m){const plu=String(parseInt(m[1],10));p=S.products.find(x=>x.plu&&String(parseInt(x.plu,10))===plu);if(p){posAdd(p,r3(parseInt(m[2],10)/1000));return true}}
 p=S.products.find(x=>x.plu&&x.plu===code);if(p){p.unit==='g'?A.posAdd({dataset:{id:p.id}}):posAdd(p,1);return true}
 return false}

function scanKey(e){
 if(!(ROUTE.n==='panel'&&ROUTE.view==='vender')||!S)return false;

 if(!$('#modal').hidden)return false;
 const t=performance.now();
 if(e.key==='Enter'){const c=SCANBUF;SCANBUF='';if(tg&&tg.id==='pq'){const code=tg.value.trim();if(!code)return false;if(posScan(code)){tg.value='';POS.q='';posDrawGrid();toast('Agregado');e.preventDefault();return true}const l=posFilter();if(l.length===1){A.posAdd({dataset:{id:l[0].id}});tg.value='';POS.q='';posDrawGrid();e.preventDefault();return true}toast('No se encontró ese código');return true}
  if(c.length>=4){if(posScan(c))toast('Agregado');else toast('Código no encontrado: '+c);e.preventDefault();return true}return false}
 if(e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){if(t-SCANT>60)SCANBUF='';SCANT=t;SCANBUF+=e.key}
 return false}

function lineSet(i,f,v){
 const l=POS.lines[i];if(!l||!(v>0)||!isFinite(v))return false;
 const p=pById(l.pid);
 if(f==='q'){if(l.unit!=='g'&&!Number.isInteger(v))return false;if(p&&!p.service&&posQtyInCart(l.pid,i)+v>p.stock)return false;l.qty=r3(v);l.amount=r2(l.qty*l.price)}
 else if(f==='p'){l.price=r4(v);l.amount=r2(l.qty*l.price)}
 else{if(l.unit==='g'){const nq=r3(v/l.price);if(!(nq>0))return false;if(p&&!p.service&&posQtyInCart(l.pid,i)+nq>p.stock)return false;l.qty=nq}else l.price=r4(v/l.qty);l.amount=r2(l.qty*l.price)}
 return true}

function posConfirm(){
 const lines=POS.lines;if(!lines.length)return;
 const pres=!POS.arca&&POS.doc==='presupuesto'||false;
 if(!pres&&!S.cash.open){closeModal();confirmBox({title:'Caja cerrada',msg:'Para cobrar hay que abrir la caja.',ok:'Ir a Caja',onOk:()=>go('caja')});return}
 const items=[];
 for(const l of lines){
  const p=pById(l.pid);if(!p){toast('Producto inexistente: '+l.name);return}
  if(!(l.qty>0)||!(l.price>0)){toast('Cantidad y precio deben ser mayores a cero');return}
  if(!pres&&!p.service&&posQtyInCart(l.pid,-1)>p.stock){toast('Stock insuficiente: '+p.name);return}
  items.push({pid:l.pid,name:l.name,unit:l.unit,qty:r3(l.qty),price:l.price,list:l.list,cost:l.cost,amount:r2(l.qty*l.price)})}
 const total=r2(items.reduce((a,i)=>a+i.amount,0));
 if(total<=0){toast('Total inválido');return}
 let cust=POS.cust?S.socios.find(s=>s.id===POS.cust):null;
 if(!pres&&POS.pay==='fiado'){
  if(!cust){toast('La cuenta corriente exige elegir un socio');return}
  const lim=cust.limit||0,nuevo=r2(socioSaldo(cust.id)+total);
  if(nuevo>lim&&SES.role!=='admin'){toast('Supera el límite de crédito ('+money(lim)+'). Sólo un administrador puede excederlo.');return}
  if(nuevo>lim)audit('credito_excedido',{socio:cust.name,limite:lim,saldo_nuevo:nuevo})}
 let recv=null;
 if(!pres&&POS.pay==='efectivo'&&POS.recv!==''){recv=parseNum(POS.recv);if(isNaN(recv)||recv<total){toast('El monto recibido no cubre el total');return}}
 const docKey=pres?'presupuesto':(POS.arca&&S.org.arca?'factura':POS.doc);
 const n=String(S.org.ptoVta||1).padStart(4,'0')+'-'+String(seq(docKey)).padStart(8,'0');
 const sale={id:uid(),n,t:now(),caja:pres?null:S.cash.open.id,user:SES.name,items,total,pay:pres?'-':POS.pay,recv,cust:cust?cust.id:'',doc:docKey==='factura'?'factura':docKey,arca:docKey==='factura',cae:null,voided:false};
 if(!pres){
  for(const it of items){const p=pById(it.pid);if(!p.service){p.stock=r3(p.stock-it.qty);S.stockMoves.push({id:uid(),t:now(),pid:p.id,delta:-it.qty,reason:'Venta '+n,user:SES.name})}
   if(it.price!==it.list)audit('precio_venta',{venta:n,producto:it.name,lista:it.list,aplicado:it.price});
   if(p.membership&&cust){const base=cust.cuotaHasta&&cust.cuotaHasta>today()?new Date(cust.cuotaHasta+'T12:00:00').getTime():now();cust.cuotaHasta=dkey(base+it.qty*(S.org.cuotaDias||30)*864e5)}}}
 S.sales.push(sale);audit(pres?'presupuesto':'venta',{n,total,pago:sale.pay,doc:sale.doc});
 persist();closeModal();
 POS.lines=[];POS.sel=-1;POS.cust='';POS.recv='';POS.pay='efectivo';
 showTicket(sale);refresh();posCli()}

A.prodSave=()=>{
 const g=id=>$('#'+id);const name=g('pf_n').value.trim(),price=g('pf_p').valueAsNumber,cost=g('pf_k').valueAsNumber,min=g('pf_m').valueAsNumber;
 const old=PF.id?pById(PF.id):null;
 if(!name)return toast('Escribí el nombre');
 if(!(price>=0)||isNaN(price))return toast('Escribí el precio');
 const svc=old?old.service:false;
 const stockIn=g('pf_s')?g('pf_s').valueAsNumber:0;
 if(g('pf_s')&&!isNaN(stockIn)&&stockIn<0)return toast('El stock no puede ser negativo');
 const bc=g('pf_b').value.trim();if(bc&&S.products.some(x=>x.barcode===bc&&x.id!==PF.id))return toast('Ese código de barras ya existe');
 const d={name,cat:g('pf_c').value,unit:g('pf_u').value,price:r2(price),cost:isNaN(cost)?0:r2(cost),min:isNaN(min)?0:min,barcode:bc,plu:g('pf_l').value.trim(),status:g('pf_e').value,desc:g('pf_d').value.trim(),pub:g('pf_pub').checked,rp:g('pf_rp').checked,img:PF.img};
 if(old){if(old.price!==d.price)audit('precio_lista',{producto:old.name,antes:old.price,despues:d.price});Object.assign(old,d)}
 else{const p=Object.assign({id:uid(),stock:0,service:false,membership:false},d);const sn=isNaN(stockIn)?0:r3(stockIn);if(sn>0){p.stock=sn;S.stockMoves.push({id:uid(),t:now(),pid:p.id,delta:sn,reason:'Stock inicial',user:SES.name})}S.products.push(p);audit('producto_alta',name)}
 persist();closeModal();toast('Producto guardado');refresh()};

async function cardToken(kind,ent){
 if(!ent.cardNonce){ent.cardNonce=b64u(rnd(6))}ent.cardExp=now()+365*864e5;
 const pl=kind+'1.'+ent.id+'.'+ent.cardExp+'.'+ent.cardNonce;return pl+'.'+await hsign(pl)}
async function verifyToken(tok){
 const p=String(tok||'').trim().split('.');if(p.length!==5)return{err:'Código inválido'};
 const [k,id,exp,nonce,sig]=p;if(k!=='TS1'&&k!=='TF1')return{err:'Código inválido'};
 const pl=[k,id,exp,nonce].join('.');if(await hsign(pl)!==sig)return{err:'Firma inválida: tarjeta falsificada o de otro sistema'};
 if(+exp<now())return{err:'Tarjeta vencida'};
 const ent=(k==='TS1'?S.socios:S.staff).find(x=>x.id===id);if(!ent)return{err:'La persona ya no existe'};
 if(ent.cardNonce!==nonce)return{err:'Tarjeta reemplazada: usá la más nueva'};
 return{kind:k,ent,sig}}
function qrSvg(text,cell){const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:cell||4,margin:0,scalable:true})}

let CAM=null;
async function scanCamera(cb){
 if(!('BarcodeDetector' in window)||!navigator.mediaDevices)return toast('La cámara no puede leer QR en este navegador. Usá lector USB o pegá el código.');
 try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const det=new BarcodeDetector({formats:['qr_code']});
  modal('<h2>Escaneando…</h2><video id="camv" autoplay playsinline muted style="width:100%;border-radius:16px;background:#000"></video><button class="btn g" style="margin-top:10px" data-a="mclose">Cancelar</button>',{onClose:()=>{CAM=null;st.getTracks().forEach(t=>t.stop())}});
  const v=$('#camv');v.srcObject=st;CAM=true;
  (async function loop(){while(CAM){try{const r=await det.detect(v);if(r.length){const val=r[0].rawValue;CAM=null;closeModal();cb(val);return}}catch(e){}await new Promise(r=>setTimeout(r,250))}})()}
 catch(e){toast('No se pudo abrir la cámara')}}
async function scanNFC(cb){
 if(!('NDEFReader' in window))return toast('NFC no disponible en este navegador (Chrome en Android).');
 try{const r=new NDEFReader();await r.scan();toast('Acercá la tarjeta…');r.onreading=ev=>{for(const rec of ev.message.records){if(rec.recordType==='text'){cb(new TextDecoder(rec.encoding||'utf-8').decode(rec.data));return}}}}catch(e){toast('No se pudo leer NFC')}}

const MAXROWS=20000,MAXBYTES=15*1024*1024;
function parseDate(v){
 if(v==null||v==='')return'';
 if(typeof v==='number'||/^\d{5}(\.\d+)?$/.test(String(v).trim())){const n=Number(v);if(n>20000&&n<80000){return dkey(Date.UTC(1899,11,30)+Math.floor(n)*864e5+12*36e5)}}
 const s=String(v).trim();let m;
 if((m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/)))return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
 if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4}|\d{2})(?!\d)/))){let y=m[3];if(y.length===2){const cy=new Date().getFullYear()%100;y=(+y>cy+1?'19':'20')+y}const d=+m[1],mo=+m[2];if(mo<1||mo>12||d<1||d>31)return'';return y+'-'+pad(mo)+'-'+pad(d)}
 return''}
function detectDelim(txt){const lines=txt.split(/\r?\n/).slice(0,8).filter(Boolean);let best=';',bs=-1;for(const d of [';',',','\t','|']){const cs=lines.map(l=>{let n=0,q=false;for(const ch of l){if(ch==='"')q=!q;else if(ch===d&&!q)n++}return n});const ok=cs.length&&cs[0]>0&&cs.every(c=>c===cs[0]);const sc=ok?cs[0]+1000:cs[0];if(sc>bs){bs=sc;best=d}}return best}
function parseCSV(txt,d){const rows=[];let row=[],cur='',q=false;for(let i=0;i<txt.length;i++){const c=txt[i];if(q){if(c==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}else if(c==='"')q=true;else if(c===d){row.push(cur);cur=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(cur);cur='';rows.push(row);row=[];if(rows.length>MAXROWS+30)throw new Error('Demasiadas filas')}else cur+=c}
 if(cur!==''||row.length){row.push(cur);rows.push(row)}return rows.filter(r=>r.some(c=>String(c).trim()!==''))}
/* lector mínimo de .xlsx (zip + xml) */
async function inflate(u8){const ds=new DecompressionStream('deflate-raw');const w=ds.writable.getWriter();w.write(u8);w.close();return new Uint8Array(await new Response(ds.readable).arrayBuffer())}
async function unzip(buf){
 const u=new Uint8Array(buf),dv=new DataView(buf);let e=-1;for(let i=u.length-22;i>=Math.max(0,u.length-70000);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}
 if(e<0)throw new Error('No es un .xlsx válido');
 const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files={};
 for(let k=0;k<n;k++){if(dv.getUint32(p,true)!==0x02014b50)break;const meth=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);const name=td.decode(u.subarray(p+46,p+46+nl));
  files[name]={meth,csz,off};p+=46+nl+el+cl}
 const get=async name=>{const f=files[name];if(!f)return null;const nl=dv.getUint16(f.off+26,true),el=dv.getUint16(f.off+28,true);const d=u.subarray(f.off+30+nl+el,f.off+30+nl+el+f.csz);return td.decode(f.meth===0?d:await inflate(d))};
 return{get,names:Object.keys(files)}}
const colIdx=ref=>{const m=/^([A-Z]+)/.exec(ref);let n=0;for(const ch of m[1])n=n*26+ch.charCodeAt(0)-64;return n-1};
async function parseXlsx(buf){
 const z=await unzip(buf);const ss=[];const sx=await z.get('xl/sharedStrings.xml');
 if(sx){const d=new DOMParser().parseFromString(sx,'application/xml');for(const si of d.getElementsByTagName('si')){ss.push(Array.from(si.getElementsByTagName('t')).map(t=>t.textContent).join(''))}}
 let sheet=z.names.filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort()[0];if(!sheet)throw new Error('El .xlsx no tiene hojas');
 const wb=await z.get('xl/workbook.xml'),rel=await z.get('xl/_rels/workbook.xml.rels');
 if(wb&&rel){try{const w=new DOMParser().parseFromString(wb,'application/xml'),r=new DOMParser().parseFromString(rel,'application/xml');const s0=w.getElementsByTagName('sheet')[0];const rid=s0.getAttribute('r:id')||s0.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');for(const x of r.getElementsByTagName('Relationship'))if(x.getAttribute('Id')===rid){let t=x.getAttribute('Target');t=t.startsWith('/')?t.slice(1):'xl/'+t;if(z.names.includes(t))sheet=t}}catch(e){}}
 const xml=new DOMParser().parseFromString(await z.get(sheet),'application/xml');const rows=[];
 for(const r of xml.getElementsByTagName('row')){const arr=[];for(const c of r.getElementsByTagName('c')){const i=colIdx(c.getAttribute('r')||'A1'),t=c.getAttribute('t');let v='';const ve=c.getElementsByTagName('v')[0];
   if(t==='s'&&ve)v=ss[+ve.textContent]||'';else if(t==='inlineStr')v=Array.from(c.getElementsByTagName('t')).map(x=>x.textContent).join('');else if(ve){v=ve.textContent;if(t!=='str'&&t!=='b'&&t!=='e'&&v!==''&&!isNaN(+v))v=Number(v)}
   while(arr.length<i)arr.push('');arr[i]=v}
  if(arr.some(x=>String(x).trim()!==''))rows.push(arr);if(rows.length>MAXROWS+30)throw new Error('Demasiadas filas')}
 return rows}
async function readRows(file){
 if(file.size>MAXBYTES)throw new Error('El archivo supera 15 MB');
 const buf=await file.arrayBuffer();
 if(/\.xlsx$/i.test(file.name)||(new Uint8Array(buf,0,2)[0]===0x50&&new Uint8Array(buf,0,2)[1]===0x4b))return parseXlsx(buf);
 let txt;try{txt=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){txt=new TextDecoder('windows-1252').decode(buf)}
 txt=txt.replace(/^﻿/,'');return parseCSV(txt,detectDelim(txt))}

 const tp=tempPass(),raw=new Uint8Array(await crypto.subtle.exportKey('raw',DK));META.users.push({id:uid(),name:n,user:u,role:r,wrap:await wrapDK(tp,raw),mustChange:true,active:true,created:now()});await saveMeta();audit('usuario_alta',{usuario:u,rol:r});tempModal(n,u,tp);refresh()};

/* ===== Arranque ===== */
function bindGlobal(){
 document.addEventListener('click',e=>{
  const t=e.target;bumpAct();
  if(t.id==='modal'&&!MOD.sticky){closeModal();return}
  const side=$('.side');if(side&&side.classList.contains('open')&&!t.closest('.side')&&!t.closest('#burger'))side.classList.remove('open');
  if(t.classList&&t.classList.contains('num')){try{t.select()}catch(_){}}
  const el=t.closest('[data-a]');if(el&&A[el.dataset.a]&&!el.disabled)A[el.dataset.a](el,e)});
 document.addEventListener('input',e=>{const el=e.target;bumpAct();if(el.dataset&&el.dataset.in&&IN[el.dataset.in])IN[el.dataset.in](el,e)});
 document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.ch&&CH[el.dataset.ch])CH[el.dataset.ch](el,e)});
 document.addEventListener('focusin',e=>{const el=e.target;if(el.classList&&el.classList.contains('num')){try{el.select()}catch(_){}el._sel=1}});
 document.addEventListener('mouseup',e=>{const el=e.target;if(el&&el._sel){e.preventDefault();el._sel=0}},true);
 document.addEventListener('keydown',e=>{
  bumpAct();const mOpen=!$('#modal').hidden;
  if(mOpen&&NP){const k=e.key;if(/^[0-9]$/.test(k)||k===','||k==='.'){e.preventDefault();npKey(k==='.'?',':k)}else if(k==='Backspace'){e.preventDefault();npKey('⌫')}else if(k==='Enter'){e.preventDefault();npKey('OK')}else if(k==='Escape'){closeModal()}
   else if(/^F\d+$/.test(k))e.preventDefault();return}
  if(e.key==='Escape'&&mOpen&&!MOD.sticky){closeModal();return}
  const kd=e.target.dataset&&e.target.dataset.kd;if(kd&&KD[kd]){KD[kd](e.target,e);return}
  if(ROUTE.n==='panel'&&ROUTE.view==='vender'&&S&&/^F([1-9]|1[0-2])$/.test(e.key)){e.preventDefault();posFKey(e.key);return}
  if(e.key==='Enter'&&e.target.tagName==='INPUT'&&!['file','checkbox','radio','button'].includes(e.target.type)){
   const scope=mOpen?$('#modal .mb'):$('.auth .c');
   if(scope&&scope.contains(e.target)){const b=scope.querySelector('.btn.y[data-a],.btn.m[data-a],.btn.bad[data-a]');if(b){e.preventDefault();b.click();return}}}
  scanKey(e)});
 document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-tid]');if(c){e.dataTransfer.setData('text/plain',c.dataset.tid);e.dataTransfer.effectAllowed='move'}});
 document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('.col[data-st]');if(c){e.preventDefault();c.classList.add('over')}});
 document.addEventListener('dragleave',e=>{const c=e.target.closest&&e.target.closest('.col[data-st]');if(c)c.classList.remove('over')});
 document.addEventListener('drop',e=>{const c=e.target.closest&&e.target.closest('.col[data-st]');if(c){e.preventDefault();c.classList.remove('over');const id=e.dataTransfer.getData('text/plain');if(id)tramDrop(id,c.dataset.st)}});
 ['mousemove','touchstart','scroll'].forEach(ev=>document.addEventListener(ev,()=>{if(now()-LASTACT>2000)bumpAct()},{passive:true}));
 window.addEventListener('hashchange',()=>{route();if(ROUTE.n==='p'||ROUTE.n==='home')window.scrollTo(0,0)});
 document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
 window.addEventListener('pagehide',()=>{flush()});
 window.addEventListener('beforeprint',()=>{});
}
async function boot(){
 if(matchMedia('(pointer:coarse)').matches)document.body.classList.add('touch');
 await idbOpen();
 META=(await kvGet('meta'))||null;
 const sp=buildPub(seedState());sp.ts=0;
 let emb=null;try{const x=$('#pubdata');const tx=x&&x.textContent.trim();if(tx&&tx!=='{}')emb=JSON.parse(tx)}catch(e){}
 const ip=await kvGet('public');
 PUB=[ip,emb,sp].filter(x=>x&&x.products).sort((a,b)=>(b.ts||0)-(a.ts||0))[0];
 bindGlobal();
 window.__raveClock=ms=>{CLK.off=ms};
 route();
 if(!IDB)toast('Este navegador bloquea el almacenamiento: los datos no se conservarán al cerrar.',8000)}
boot();

})();
