/* ============ Cripto: HMAC SHA-256 ============ */
const enc=new TextEncoder();
async function sign(msg){const k=await crypto.subtle.importKey('raw',enc.encode(root.secret),{name:'HMAC',hash:'SHA-256'},false,['sign']);const s=await crypto.subtle.sign('HMAC',k,enc.encode(msg));return [...new Uint8Array(s)].map(b=>b.toString(16).padStart(2,'0')).join('')}
async function mint(kind,sub){const ts=Date.now(),n=rnd(8),b=[kind,sub,ts,n].join('.');return 'T1.'+b+'.'+await sign(b)}
function safeEq(a,b){if(a.length!==b.length)return false;let r=0;for(let i=0;i<a.length;i++)r|=a.charCodeAt(i)^b.charCodeAt(i);return r===0}
async function verify(tok){
 const p=String(tok).trim().split('.');
 if(p.length!==6||p[0]!=='T1'||!/^[A-Za-z0-9]+$/.test(p.slice(1).join('')))return{ok:false,msg:'Formato de token inválido'};
 const[,kind,sub,ts,nonce,sig]=p,exp=await sign([kind,sub,ts,nonce].join('.'));
 if(!safeEq(exp,sig))return{ok:false,msg:'Firma HMAC inválida (token adulterado)'};
 if(Math.abs(Date.now()-(+ts))>60000)return{ok:false,msg:'Token vencido (validez 60 s)'};
 if(S.nonces[nonce])return{ok:false,msg:'Replay detectado: el token ya fue usado'};
 S.nonces[nonce]=Date.now();Object.keys(S.nonces).forEach(k=>{if(Date.now()-S.nonces[k]>3600e3)delete S.nonces[k]});
 return{ok:true,kind,sub};
}

function readImg(file,max,type){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL(type,.75))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
function addMov(tipo,concepto,cat,monto,metodo,extra){S.movs.push({id:uid(),ts:Date.now(),tipo,concepto,cat,monto,metodo,sesion:S.caja.sesion||'x',...extra})}
function confirmSale(metodo){
 const it=Object.entries(cart).map(([id,q])=>({p:S.prods.find(x=>x.id===id),q})).filter(x=>x.p&&x.q>0);
 const s=socio(cSocio);
 if(!it.length)return toast('Carrito vacío');
 if(it.some(x=>x.p.reg)){if(!s)return toast('Elegí un socio para productos de dispensa');if(!s.repro||daysTo(s.vence)<0)return toast('Bloqueado: REPROCANN vencido o inexistente');}
 for(const x of it)if(x.q>x.p.stock)return toast('Stock insuficiente: '+x.p.nombre);
 if(metodo==='Cuenta corriente'&&!s)return toast('Elegí un socio');
 if(metodo!=='Cuenta corriente'&&!S.caja.abierta)return toast('Abrí la caja primero');
 const tot=it.reduce((a,x)=>a+x.p.precio*x.q,0);
 it.forEach(x=>{x.p.stock-=x.q;S.stockMovs.push({ts:Date.now(),pid:x.p.id,delta:-x.q,motivo:'Venta'})});
 S.ventas.push({id:uid(),ts:Date.now(),socioId:cSocio,items:it.map(x=>({n:x.p.nombre,q:x.q,p:x.p.precio})),total:tot,metodo});
 if(metodo==='Cuenta corriente'){s.saldo+=tot}else addMov('ingreso',labelPos()+(s?' · '+s.nombre.split(' (')[0]:''),'Ventas',tot,metodo);
 cart={};closeModal();save();toast('Venta registrada: '+money(tot));
}

async function processFich(tok){
 const m=$('#fmsg');
 if(root.simOut){m.textContent='⛔ Rechazado: la solicitud no proviene de la red local del comercio.';m.className='bad-t';return}
 const r=await verify(tok);
 if(!r.ok||r.kind!=='E'){m.textContent='⛔ '+(r.msg||'Token no corresponde a un empleado');m.className='bad-t';persist();return}
 const e=S.emps.find(x=>x.id===r.sub);if(!e){m.textContent='⛔ Empleado inexistente';return}
 S.fich.push({id:uid(),empId:e.id,tipo:presente(e.id)?'salida':'entrada',ts:Date.now(),via:'NFC'});
 persist();render();$('#fmsg').textContent='✅ '+e.nombre+' registrado';$('#fmsg').className='ok-t';
}
async function processSello(tok){
 const m=$('#smsg');devSel=$('#dev').value;
 if(root.role==='profesional'){m.textContent='⛔ Solo se valida en mostrador (rol Mostrador o Administración).';m.className='bad-t';return}
 const last=S.sellosLog[devSel];
 if(last&&Date.now()-last<DAY){m.textContent='⛔ Límite: este dispositivo ya validó en las últimas 24 h (reintentá en '+Math.ceil((DAY-(Date.now()-last))/3600e3)+' h).';m.className='bad-t';return}
 const r=await verify(tok);
 if(!r.ok||r.kind!=='S'){m.textContent='⛔ '+(r.msg||'Token no válido para fidelidad');m.className='bad-t';persist();return}
 const s=socio(r.sub);if(!s)return;
 S.sellosLog[devSel]=Date.now();s.sellos=Math.min(S.org.meta,s.sellos+1);persist();render();
 $('#smsg').textContent='✅ Sello acreditado a '+s.nombre;$('#smsg').className='ok-t';
}

 checkout:()=>modal(mHead('Cobrar')+`<form data-form="pay"><label>Medio de pago</label>${['Efectivo','Transferencia','Cuenta corriente'].map((m,i)=>`<label style="display:flex;gap:10px;align-items:center;font-size:15px;color:#111"><input type="radio" name="metodo" value="${m}" ${i?'':'checked'}> ${m}</label>`).join('')}<button class="btn m" style="margin-top:16px;width:100%">Confirmar venta</button></form>`),
 catNew:()=>modal(mHead('Nueva categoría')+`<form data-form="cat">${field('Nombre','nombre','','required maxlength="40"')}<button class="btn y" style="margin-top:14px">${t('guardar')}</button></form>`),
 catEdit:d=>{const c=S.cats.find(x=>x.id===d.id);modal(mHead('Editar categoría')+`<form data-form="cat"><input type="hidden" name="id" value="${c.id}">${field('Nombre','nombre',c.nombre,'required maxlength="40"')}<button class="btn y" style="margin-top:14px">${t('guardar')}</button></form>`)},
 catDel:d=>{if(S.prods.some(p=>p.cat===d.id))return toast('Mové o eliminá primero sus productos');if(confirm('¿Eliminar categoría?')){S.cats=S.cats.filter(c=>c.id!==d.id);save()}},
 prodNew:()=>S.cats.length?prodForm():toast('Creá una categoría primero'),prodEdit:d=>prodForm(S.prods.find(p=>p.id===d.id)),
 prodDel:d=>{if(confirm('¿Eliminar producto?')){S.prods=S.prods.filter(p=>p.id!==d.id);delete cart[d.id];save()}},
 stock:d=>modal(mHead('Ajustar stock')+`<form data-form="stock"><input type="hidden" name="id" value="${d.id}">${field('Cantidad (+ ingreso / − egreso)','delta','','type="number" step="1" required')}${field('Motivo','motivo','Reposición','maxlength="60"')}<button class="btn y" style="margin-top:14px">${t('guardar')}</button></form>`),
 cerrar:()=>modal(mHead('Cierre y arqueo')+`<p>Efectivo esperado: <b>${money(esperado())}</b></p><form data-form="cerrar">${field('Efectivo contado','contado','','type="number" min="0" step="1" required')}<button class="btn m" style="margin-top:14px">Cerrar caja</button></form>`),
 coreNew:()=>coreForm(),coreEdit:d=>coreForm(S.core.find(x=>x.id===d.id)),
 coreDel:d=>{S.core=S.core.filter(x=>x.id!==d.id);closeModal();save()},
 cmove:d=>{const x=S.core.find(i=>i.id===d.id),n=x.col+(+d.d);if(n>=0&&n<CORE[R()].cols.length){x.col=n;save()}},
 mesa:d=>{const m=S.mesas.find(x=>x.id===d.id),o=['Libre','Ocupada','Cuenta pedida'];m.estado=o[(o.indexOf(m.estado)+1)%3];save()},
 mesaNew:()=>{S.mesas.push({id:uid(),n:S.mesas.length+1,estado:'Libre',mozo:''});save()},
 empNew:()=>modal(mHead('Nuevo empleado')+`<form data-form="emp">${field('Nombre','nombre','','required maxlength="60"')}${field('Rol','rol','','maxlength="40"')}${field('DNI','dni','','required inputmode="numeric" pattern="\\d{7,8}"')}<button class="btn y" style="margin-top:14px">${t('guardar')}</button></form>`),
 mintE:async()=>{lastTok=await mint('E',$('#empsel').value);$('#tok').value=lastTok;$('#fmsg').textContent='Token generado: válido 60 s y de un solo uso.'},
 tapE:()=>processFich($('#tok').value),
 replay:()=>processFich(lastTok),
 nfcW:async()=>{if(!('NDEFReader' in window))return toast('Web NFC no disponible en este navegador');try{await new NDEFReader().write({records:[{recordType:'text',data:$('#tok').value}]});toast('Tarjeta escrita')}catch(e){toast('NFC: '+e.message)}},
 nfcR:async()=>{if(!('NDEFReader' in window))return toast('Web NFC no disponible en este navegador');try{const n=new NDEFReader();await n.scan();toast('Acercá la tarjeta…');n.onreading=ev=>{for(const r of ev.message.records)if(r.recordType==='text'){const tx=new TextDecoder(r.encoding||'utf-8').decode(r.data);$('#tok').value=tx;processFich(tx)}}}catch(e){toast('NFC: '+e.message)}},
 csvF:()=>dl('fichajes.csv','text/csv','fecha,hora,empleado,tipo,via\n'+S.fich.slice().sort((a,b)=>a.ts-b.ts).map(f=>[fdate(f.ts),ftime(f.ts),'"'+empName(f.empId).replace(/"/g,'')+'"',f.tipo,f.via].join(',')).join('\n')),
 mintS:async()=>{lastTok=await mint('S',$('#fsoc').value);$('#tok2').value=lastTok;$('#smsg').textContent='QR dinámico generado (60 s).';$('#smsg').className=''},
 tapS:()=>processSello($('#tok2').value),
 canje:d=>{const s=socio(d.id);s.sellos=0;save();toast('Premio canjeado')},
 wRot:d=>{const w=S.wifi.find(x=>x.id===d.id);w.pass=genPass();w.exp=Date.now()+4*3600e3;save();toast('Credenciales rotadas')},
 wRev:d=>{S.wifi.find(x=>x.id===d.id).rev=true;save()},
 cae:d=>{const f=S.facturas.find(x=>x.id===d.id);f.cae=String(Date.now()).slice(0,14).padEnd(14,'7');f.caeVto=addDays(10);f.sim=true;save();toast('CAE simulado asignado')},
 fver:d=>{const f=S.facturas.find(x=>x.id===d.id),o=S.org;modal(`<div class="x"><div class="row no-p" style="justify-content:space-between"><h2>Comprobante</h2><div class="act"><button class="btn sm" onclick="window.print()">Imprimir</button><button class="btn sm g" data-act="close">Cerrar</button></div></div><div style="border:1px solid #ddd;border-radius:14px;padding:18px;margin-top:10px"><div class="row" style="justify-content:space-between"><div><b>${esc(o.legal)}</b><div class="sub">CUIT ${esc(o.cuit)} · ${esc(o.condIva)}<br>${esc(o.calle)}, ${esc(o.ciudad)}</div></div><div style="text-align:center;border:2px solid #111;padding:6px 16px;font-size:28px;font-weight:800">${f.tipo}</div></div><p style="margin-top:12px"><b>${f.tipo==='C'?'Factura C':'Factura '+f.tipo}</b> N° ${f.pv}-${f.nro} · ${fdate(f.ts)}</p><p>Receptor: ${esc(f.nombre)} ${f.doc?'· '+esc(f.doc):''} · ${esc(f.cond)}</p><p>${esc(f.concepto)}</p><p class="kpi">${money(f.importe)}</p><p class="sub">CAE: ${f.cae?esc(f.cae)+' · Vto '+esc(f.caeVto)+' (SIMULADO)':'pendiente de solicitud'}</p></div></div>`)},
 bk:()=>dl('respaldo-terps.json','application/json',JSON.stringify(S,null,1)),
 rotSec:()=>{if(confirm('Los tokens vigentes dejarán de ser válidos. ¿Continuar?')){root.secret=rnd(32);persist();toast('Clave rotada')}},
 reset:()=>{if(confirm('Se borrarán todos los datos locales de esta demo.')){localStorage.removeItem(LS);location.reload()}}
};
function genPass(){const a='abcdefghjkmnpqrstuvwxyz23456789',b=new Uint8Array(8);crypto.getRandomValues(b);return[...b].map(x=>a[x%a.length]).join('')}
function dl(name,type,txt){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}

const FORMS={
 socio:d=>{const o={nombre:clean(d.nombre,80),dni:clean(d.dni,8).replace(/\D/g,''),tel:clean(d.tel,15).replace(/\D/g,''),repro:clean(d.repro,30),vence:d.vence||addDays(365),notas:clean(d.notas,200)};if(!o.nombre||o.dni.length<7)return toast('Revisá nombre y DNI');
  if(d.id)Object.assign(socio(d.id),o);else S.socios.push({id:uid(),cuotaMes:ym(Date.now()-35*DAY),saldo:0,sellos:0,consentTs:Date.now(),...o});closeModal();save()},
 cobro:d=>{const s=socio(d.id),m=num(d.monto);if(m<=0)return;
  if(d.metodo==='Cuenta corriente')s.saldo+=m;else{if(!S.caja.abierta)return toast('Abrí la caja primero');addMov('ingreso','Cuota · '+s.nombre.split(' (')[0],'Cuotas',m,d.metodo,{socioId:s.id})}
  s.cuotaMes=ym();closeModal();save();toast('Cuota registrada')},
 abono:d=>{const s=socio(d.id),m=Math.min(num(d.monto),s.saldo);if(m<=0)return;if(!S.caja.abierta)return toast('Abrí la caja primero');s.saldo-=m;addMov('ingreso','Cobro cuenta corriente · '+s.nombre.split(' (')[0],'Cuenta corriente',m,d.metodo,{socioId:s.id});closeModal();save();toast('Cobro registrado')},
 pay:d=>confirmSale(d.metodo),
 cat:d=>{const n=clean(d.nombre,40);if(!n)return;if(d.id)S.cats.find(c=>c.id===d.id).nombre=n;else S.cats.push({id:uid(),nombre:n});closeModal();save()},
 prod:d=>{const o={nombre:clean(d.nombre,70),cat:d.cat,precio:num(d.precio),stock:Math.max(0,Math.round(num(d.stock))),min:Math.max(0,Math.round(num(d.min))),cod:clean(d.cod,14).replace(/\D/g,''),reg:R()==='asociacion'?!!d.reg:false,img:tmpImg};if(!o.nombre)return;
  if(d.id)Object.assign(S.prods.find(p=>p.id===d.id),o);else S.prods.push({id:uid(),...o});tmpImg='';closeModal();save();toast('Guardado y visible en el catálogo')},
 stock:d=>{const p=S.prods.find(x=>x.id===d.id),dl=Math.round(num(d.delta));if(!dl)return;p.stock=Math.max(0,p.stock+dl);S.stockMovs.push({ts:Date.now(),pid:p.id,delta:dl,motivo:clean(d.motivo,60)});closeModal();save()},
 abrir:d=>{S.caja={abierta:true,fondo:Math.max(0,num(d.fondo)),apertura:Date.now(),sesion:uid()};save()},
 gasto:d=>{const m=num(d.monto);if(m<=0)return;addMov('egreso',clean(d.concepto,80),d.cat,m,d.metodo);save()},
 cerrar:d=>{const e=esperado(),c=num(d.contado);S.cierres.push({apertura:S.caja.apertura,cierre:Date.now(),fondo:S.caja.fondo,esperado:e,contado:c,dif:c-e});S.caja={abierta:false};closeModal();save();toast('Caja cerrada. Diferencia: '+money(c-e))},
 core:d=>{const o={titulo:clean(d.titulo,60),socioId:d.socioId,detalle:clean(d.detalle,200),resp:d.resp};if(d.id)Object.assign(S.core.find(x=>x.id===d.id),o);else S.core.push({id:uid(),col:0,...o});closeModal();save()},
 emp:d=>{S.emps.push({id:uid(),nombre:clean(d.nombre,60),rol:clean(d.rol,40),dni:clean(d.dni,8)});closeModal();save()},
 wifi:d=>{const w={id:uid(),nombre:clean(d.nombre,60),dni:clean(d.dni,8),email:clean(d.email,80),user:'visita-'+rnd(2),pass:genPass(),ip:'192.168.0.'+(20+Math.floor(Math.random()*200)),mac:rnd(6).match(/../g).join(':'),ts:Date.now(),exp:Date.now()+4*3600e3};S.wifi.push(w);save();toast('Conectado. Usuario '+w.user+' · clave '+w.pass)},
 factura:d=>{const doc=clean(d.doc,13).replace(/\D/g,'');
  if(doc&&doc.length===11&&!cuitOk(doc))return toast('El CUIT ingresado no es válido');
  if(doc&&doc.length!==11&&(doc.length<7||doc.length>8))return toast('Documento inválido');
  if(d.cond==='Responsable Inscripto'&&doc.length!==11)return toast('Un Responsable Inscripto requiere CUIT válido');
  const tipo=tipoSug(d.cond),nro=String(S.facturas.length+1).padStart(8,'0');
  S.facturas.push({id:uid(),ts:Date.now(),tipo,pv:'0001',nro,nombre:clean(d.nombre,80),doc,cond:d.cond,concepto:clean(d.concepto,100),importe:num(d.importe),cae:''});save()},
 arco:d=>{S.arco.push({ts:Date.now(),nombre:clean(d.nombre,60),dni:clean(d.dni,8),der:d.der});save();toast('Solicitud registrada. Respuesta en hasta 10 días corridos.')},
 arrep:d=>{S.arrep.push({ts:Date.now(),nombre:clean(d.nombre,60),nro:clean(d.nro,20)});save();toast('Revocación registrada')},
 tenant:d=>{const id=uid(),n=clean(d.name,60);root.tenants.push({id,name:n,rubro:d.rubro});root.data[id]=seedBlank(n,d.rubro);root.active=id;S=root.data[id];closeModal();persist();view='dash';render()},
 org:d=>{const o=S.org;['marca','legal','comercial','cuit','calle','barrio','ciudad','franjas','tel','email','ig','fb','premio','lan','web','condIva','desc','waMsg'].forEach(k=>o[k]=clean(d[k],k==='desc'||k==='waMsg'?400:120));o.tel=o.tel.replace(/\D/g,'');o.cuota=num(d.cuota);o.meta=Math.min(12,Math.max(2,Math.round(num(d.meta))||8));if(tmpLogo){o.logo=tmpLogo;tmpLogo=''}
  const t0=root.tenants.find(x=>x.id===root.active);t0.name=o.marca;save();toast('Configuración guardada')}
};

/* ============ Eventos ============ */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b){const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b.dataset,e)}}});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.change;if(k&&CH[k])CH[k](e.target.value,e.target)});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.in;if(k&&IN[k])IN[k](e.target.value)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter==='barcode'){const p=S.prods.find(x=>x.cod===e.target.value.trim());if(p){ACT.add({id:p.id});e.target.value=''}else toast('Código no encontrado')}
 if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.act==='mesa'){e.preventDefault();ACT.mesa(e.target.dataset)}});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const h=FORMS[f.dataset.form];if(h)h(Object.fromEntries(new FormData(f)),f)});
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-drag]');if(c)e.dataTransfer.setData('text/plain',c.dataset.drag)});
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('[data-drop]');if(c){e.preventDefault();c.classList.add('over')}});
document.addEventListener('dragleave',e=>{const c=e.target.closest&&e.target.closest('[data-drop]');if(c)c.classList.remove('over')});
document.addEventListener('drop',e=>{const c=e.target.closest&&e.target.closest('[data-drop]');if(!c)return;e.preventDefault();const x=S.core.find(i=>i.id===e.dataTransfer.getData('text/plain'));if(x){x.col=+c.dataset.drop;save()}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
addEventListener('hashchange',()=>{const v=location.hash.replace('#/','');if(V[v]&&v!==view){view=v;render()}});
addEventListener('resize',()=>{$('#collapse').style.display=innerWidth>=1024?'grid':'none'});
POST.publico=()=>{if(!sessionStorage.getItem('age18')){modal(`<h2>Sitio para mayores de 18 años</h2><p class="sub" style="margin:8px 0 16px">El contenido está dirigido a personas adultas. Confirmá tu edad para continuar.</p><div class="row"><button class="btn y" data-act="age">Soy mayor de 18</button><a class="btn g" href="https://www.argentina.gob.ar">Salir</a></div>`)}};
ACT.age=()=>{sessionStorage.setItem('age18','1');closeModal()};

boot();
{const v=location.hash.replace('#/','');if(V[v])view=v}
render();
</script>
