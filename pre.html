<style>
:root{--y:#F4CE00;--y2:#FFF4B8;--m:#E6007E;--m2:#fde0ef;--ink:#111113;--ink2:#1c1c20;--bg:#F6F4EE;--card:#fff;--mut:#666670;--line:#ececf0;--ok:#0f9d58;--warn:#d98f00;--bad:#d92d4b;--r:22px;--sh:0 1px 2px rgba(17,17,19,.04),0 8px 30px rgba(17,17,19,.06);--sw:264px}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
a{color:inherit}
:focus-visible{outline:3px solid var(--m);outline-offset:2px}
h1{font-size:26px;letter-spacing:-.6px;font-weight:780;line-height:1.1}
h2{font-size:17px;letter-spacing:-.2px;font-weight:700}
h3{font-size:14px;font-weight:650}
.sub{color:var(--mut);font-size:14px}.mut{color:var(--mut)}.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}.b{font-weight:700}
.sr{position:absolute;left:-9999px}
.lbl{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);font-weight:600}
.dark .lbl,.pink .lbl{color:rgba(255,255,255,.7)}.yel .lbl{color:rgba(17,17,19,.62)}
/* botones y formularios */
.btn{display:inline-flex;gap:8px;align-items:center;justify-content:center;border:0;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;cursor:pointer;font-weight:650;min-height:44px;text-decoration:none;white-space:nowrap;text-align:center;line-height:1.2}
.btn:hover{filter:brightness(1.15)}
.btn.y{background:var(--y);color:var(--ink)}.btn.m{background:var(--m)}.btn.g{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.wa{background:#1fa855}.btn.bad{background:var(--bad)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:13px}
.btn.lg{min-height:52px;font-size:16px;padding:12px 24px}
.btn[disabled],.btn.off{opacity:.4;pointer-events:none}
.btn kbd{font:600 11px ui-monospace,Consolas,monospace;background:rgba(0,0,0,.14);border-radius:6px;padding:1px 6px}
.btn.g kbd,.btn.y kbd{background:rgba(0,0,0,.08)}
.ib{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
label{display:block;font-size:12px;font-weight:650;color:var(--mut);margin:12px 0 5px;letter-spacing:.3px}
input,select,textarea{width:100%;border:1px solid #dcdce4;border-radius:14px;padding:11px 14px;background:#fff;min-height:46px}
textarea{min-height:90px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto;min-height:0}
input[type=file]{padding:9px}
.sel{border:1px solid var(--line);background:#fff;border-radius:14px;padding:9px 12px;min-height:44px;max-width:100%;width:auto}
.g2{display:grid;gap:0 14px;grid-template-columns:1fr}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 15px;cursor:pointer;font-size:13px;font-weight:650;min-height:38px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:650;background:#eee;color:#444;white-space:nowrap}
.badge.ok{background:#dff5e8;color:#0a6b3a}.badge.warn{background:#fff0c7;color:#8a5a00}.badge.bad{background:#fde0e5;color:#a3122c}.badge.m{background:var(--m2);color:#a30060}.badge.dk{background:var(--ink);color:#fff}
/* layout panel */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:min(86vw,300px);background:var(--ink);color:#e9e9ee;z-index:40;transform:translateX(-102%);transition:transform .25s;display:flex;flex-direction:column;padding:20px 14px;overflow:auto}
.side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 20px}
.logo{width:44px;height:44px;border-radius:14px;background:var(--y);display:grid;place-items:center;font-weight:900;color:var(--ink);font-size:20px;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:cover}
.brand b{display:block;font-size:15px;color:#fff}.brand small{color:#9a9aa6;font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;gap:12px;align-items:center;background:none;border:0;color:#c1c1cc;padding:11px 12px;border-radius:14px;cursor:pointer;text-align:left;white-space:nowrap;min-height:44px}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:var(--y);color:var(--ink);font-weight:650}
.nav .sep{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#777784;padding:16px 12px 6px}
.side .credit{margin-top:auto;padding:16px 8px 4px;font-size:11px;color:#8a8a96;line-height:1.4}
.side .credit a{color:var(--y)}
.main{min-width:0;display:flex;flex-direction:column;min-height:100vh}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(246,244,238,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
#view{padding:18px 16px 28px;width:100%;max-width:1480px;margin:0 auto;flex:1}
.ph{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.bento{display:grid;grid-template-columns:1fr;gap:14px}
.c{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--sh);border:1px solid rgba(17,17,19,.04);min-width:0}
.c.dark{background:var(--ink);color:#fff}.c.yel{background:var(--y)}.c.pink{background:var(--m);color:#fff}
.kpi{font-size:32px;font-weight:800;letter-spacing:-1.2px;line-height:1.05;margin:8px 0 2px;overflow-wrap:anywhere}
.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:var(--mut);text-align:left;padding:10px 12px;font-weight:600;white-space:nowrap}
td{padding:12px;border-top:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#fbfaf6}
td.r,th.r{text-align:right}
.act{display:flex;gap:6px;flex-wrap:wrap}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.li:first-child{border-top:0}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.pc{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;display:flex;flex-direction:column;min-width:0}
.pc .im{aspect-ratio:1/1;background:linear-gradient(135deg,var(--y2),#ffd9ec);display:grid;place-items:center;font-size:34px;font-weight:800;color:rgba(17,17,19,.25);overflow:hidden}
.pc .im img{width:100%;height:100%;object-fit:cover}
.pc .bd{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.pc.sel1{outline:3px solid var(--m)}
.kan{display:grid;grid-template-columns:1fr;gap:12px}
.col{background:#efece3;border-radius:18px;padding:12px;min-height:120px}
.col.over{outline:2px dashed var(--m)}
.card{background:#fff;border-radius:14px;padding:12px;margin-top:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:grab}
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:360px}
.st{aspect-ratio:1;border-radius:50%;border:2px dashed #ccc;display:grid;place-items:center;font-weight:800;color:#bbb}
.st.f{background:var(--y);border:2px solid var(--ink);color:var(--ink)}
.tok{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all}
pre{background:#0e0e10;color:#e6e6ea;padding:14px;border-radius:14px;overflow:auto;font-size:12px;max-height:280px}
.legal{max-height:420px;overflow:auto;font-size:14px;color:#333}.legal h3{margin:14px 0 4px}
.notice{background:var(--y2);border:1px solid #f0dc7a;border-radius:16px;padding:12px 16px;font-size:14px;margin-bottom:16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.notice.bad{background:#fde0e5;border-color:#f3b4c0}
/* POS */
.pos{display:grid;gap:14px;grid-template-columns:1fr}
.fbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:8px}.fbar .btn{white-space:normal;line-height:1.15}
.line{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:10px;border:2px solid transparent;border-radius:14px;cursor:pointer;background:#faf9f5;margin-top:8px}
.line.on{border-color:var(--m);background:#fff}
.line .nm{font-weight:650}
.sw{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px;background:#eee;color:#555}
/* modal / toast */
.modal{position:fixed;inset:0;z-index:80;background:rgba(17,17,19,.58);display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal[hidden]{display:none}
.mb{background:#fff;border-radius:26px 26px 0 0;padding:22px;width:100%;max-width:660px;max-height:92vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;z-index:99;font-size:14px;max-width:92vw;box-shadow:var(--sh)}
.fab{position:fixed;right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;background:var(--m);color:#fff;border:0;display:grid;place-items:center;box-shadow:0 10px 30px rgba(230,0,126,.4);cursor:pointer;z-index:35}
/* teclado numérico */
.npd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.npd button{min-height:60px;border-radius:16px;border:1px solid var(--line);background:#faf9f5;font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer}
.npd button:active{background:var(--y)}
.npv{font-size:34px;font-weight:800;text-align:center;padding:14px;background:#faf9f5;border-radius:16px;min-height:72px;display:flex;align-items:center;justify-content:center;letter-spacing:-1px}
.npv.empty{font-size:18px;font-weight:600;color:var(--mut);letter-spacing:0}
/* login */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--y);position:relative;overflow:hidden}
.auth::before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.35),transparent 40%),radial-gradient(circle at 85% 80%,rgba(230,0,126,.18),transparent 45%)}
.auth .c{position:relative;max-width:440px;width:100%;padding:28px}
.rc{font:700 20px ui-monospace,Consolas,monospace;letter-spacing:2px;text-align:center;background:var(--ink);color:var(--y);border-radius:16px;padding:16px;word-break:break-word}
body.booting #root{visibility:hidden}
/* sitio público */
.pub{background:var(--bg)}
.pbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 16px;background:#111113;color:#fff;min-height:60px}
.pbar .nm{flex:1;min-width:0;display:flex;gap:10px;align-items:center;text-decoration:none;color:#fff}
.pbar .nm b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pnav{position:sticky;top:60px;z-index:29;background:#1c1c20;display:flex;gap:6px;overflow-x:auto;padding:6px 12px;scrollbar-width:none}
.pnav a{color:#e9e9ee;text-decoration:none;font-size:13px;font-weight:650;padding:8px 14px;border-radius:999px;white-space:nowrap;min-height:36px;display:inline-flex;align-items:center}
.pnav a,.pnav button{color:#e9e9ee;background:transparent;border:0;text-decoration:none;font:inherit;font-size:13px;font-weight:650;padding:8px 14px;border-radius:999px;white-space:nowrap;min-height:36px;display:inline-flex;align-items:center;cursor:pointer}
.pnav a:hover,.pnav a.on,.pnav button:hover,.pnav button:focus-visible,.pnav button.on{background:var(--y);color:var(--ink)}
.pnav button:focus-visible{outline:2px solid #fff;outline-offset:1px}
.vbb{position:relative;margin:0 auto}
.vbb img{display:block;width:100%;height:auto;border-radius:12px}
.vbb-a{position:absolute;top:85%;height:8.5%;border-radius:999px}
.vbb-a.wa{left:5.2%;width:24.9%}.vbb-a.ml{left:31.8%;width:44%}
.vbb-a:focus-visible{outline:3px solid #fff;outline-offset:2px}
.vbbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px auto 0}
.vbbtn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;min-width:104px;padding:0 18px;border:1px solid currentColor;border-radius:999px;font-weight:650;text-decoration:none;color:inherit}
.vbbtn:hover{background:rgba(127,127,127,.12)}
.mb.wide{max-width:960px}
.updbar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:9999;display:flex;gap:12px;align-items:center;background:#111113;color:#fff;padding:10px 12px 10px 18px;border-radius:999px;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px);flex-wrap:wrap;justify-content:center}
html{scroll-padding-top:112px}
.pbar .logo{width:40px;height:40px;border-radius:12px}
.pbar b{font-size:15px}
.pbar .ib{background:transparent;border-color:rgba(255,255,255,.25);color:#fff}
.pbar .btn.g{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.hero{background:var(--y);position:relative;overflow:hidden;padding:30px 16px 36px}
.hero::after{content:"";position:absolute;inset:0;background:repeating-radial-gradient(ellipse at 90% 10%,transparent 0 46px,rgba(0,0,0,.045) 46px 60px);pointer-events:none}
.hero .in{position:relative;z-index:1;max-width:1180px;margin:0 auto;display:grid;gap:22px}
.hero h1{font-size:40px;letter-spacing:-1.8px;line-height:.98}
.hero h1 em{font-style:normal;color:var(--m)}
.hero .lg-img{width:min(280px,70vw);border-radius:30px;box-shadow:0 20px 50px rgba(0,0,0,.2);transform:rotate(-3deg)}
.psec{max-width:1180px;margin:0 auto;padding:26px 16px}
.pcard{background:#fff;border-radius:22px;overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;min-width:0;border:1px solid rgba(17,17,19,.05)}
.pcard .im{aspect-ratio:1/1;background:#111;overflow:hidden;cursor:pointer}
.pcard .im.tall{aspect-ratio:2/3}
.pcard .im img{width:100%;height:100%;object-fit:cover;display:block}
.pcard .bd{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.pcard .pr{font-size:20px;font-weight:800;letter-spacing:-.5px}
.pcard h3{font-size:15px;line-height:1.25}
.cartbar{position:fixed;left:12px;right:84px;bottom:12px;z-index:36;background:var(--ink);color:#fff;border-radius:999px;padding:8px 8px 8px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 12px 34px rgba(0,0,0,.3)}
.pfoot{background:var(--ink);color:#c6c6cf;padding:34px 16px 90px;margin-top:30px}
.pfoot .fg{display:grid;gap:22px;grid-template-columns:1fr;max-width:1180px;margin:0 auto}
.pfoot h4{color:#fff;font-size:13px;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:10px}
.pfoot a{color:var(--y);text-decoration:none}.pfoot small{color:#8e8e99}
.qrbox{background:#fff;padding:12px;border-radius:18px;display:inline-block;line-height:0}
/* ticket */
.ticket{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;width:100%;max-width:302px;margin:0 auto;color:#000;background:#fff;padding:8px}
.ticket hr{border:0;border-top:1px dashed #000;margin:6px 0}
.ticket .c2{text-align:center}.ticket .rw{display:flex;justify-content:space-between;gap:6px}
.ticket .nv{font-weight:700;text-align:center;border:1px solid #000;padding:4px;margin:6px 0}

.tabs{display:flex;gap:6px;background:#efece3;padding:5px;border-radius:999px;margin:14px 0}
.tabs button{flex:1;border:0;background:transparent;border-radius:999px;padding:10px 12px;font-weight:700;cursor:pointer;min-height:44px;color:var(--mut)}
.tabs button[aria-selected=true]{background:var(--ink);color:#fff}
.fe{color:var(--bad);font-size:13px;min-height:18px;margin-top:3px}
input.err,select.err,textarea.err{border-color:var(--bad)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:500;letter-spacing:0;color:var(--ink);margin:12px 0}
.chk input{margin-top:3px;width:20px;height:20px;flex:none}
.credit{background:var(--ink);color:#e9e9ee;border-radius:22px;padding:20px;margin:0 auto;max-width:1180px}
.credit a{color:var(--y)}
.pcred{padding:6px 16px 120px;background:var(--ink)}
.exb{background:var(--y2);border:1px solid #f0dc7a;border-radius:14px;padding:8px 12px;font-size:13px}
.hon{position:absolute;left:-9999px;opacity:0;height:0;width:0}
@media (min-width:768px){
 h1{font-size:32px}
 .bento{grid-template-columns:repeat(6,1fr);gap:16px}
 .s3,.s4{grid-column:span 3}.s6,.s8,.s12{grid-column:span 6}
 .g2{grid-template-columns:1fr 1fr}
 .pgrid{grid-template-columns:repeat(3,1fr)}
 .kan{grid-template-columns:repeat(2,1fr)}
 .modal{align-items:center;padding:20px}.mb{border-radius:26px}
 #view{padding:26px 28px 36px}.top{padding:12px 28px}
 .hero{padding:48px 28px 56px}.hero .in{grid-template-columns:1.3fr 1fr;align-items:center}.hero h1{font-size:56px}
 .psec{padding:34px 28px}
 .pfoot{padding:44px 28px 90px}.pfoot .fg{grid-template-columns:1.4fr 1fr 1fr}
 .pbar{padding:12px 28px}
 .cartbar{left:auto;right:84px;width:420px}
}
@media (min-width:1024px){
 .app{grid-template-columns:var(--sw) minmax(0,1fr)}
 .side{position:sticky;top:0;height:100vh;transform:none;width:var(--sw);box-shadow:none!important}
 .app.col{grid-template-columns:84px minmax(0,1fr)}.app.col .side{width:84px}
 .app.col .brand div,.app.col .nav span,.app.col .nav .sep,.app.col .credit{display:none}
 .app.col .nav button{justify-content:center}
 #burger{display:none}
 .bento{grid-template-columns:repeat(12,1fr)}
 .s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}.s8{grid-column:span 8}.s12{grid-column:span 12}
 .kan{grid-template-columns:repeat(4,1fr)}
 .pos{grid-template-columns:1.5fr 1fr}
 .hero h1{font-size:72px}
}
@media (min-width:1440px){
 #view{padding:34px 48px 48px}.top{padding:14px 48px}
 .pgrid{grid-template-columns:repeat(4,1fr)}.kpi{font-size:40px}
 .psec,.pfoot .fg,.hero .in{max-width:1320px}
}
#ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (max-width:767px){#usr{display:none}.top{gap:6px;padding:8px 10px}.top .ib{width:40px;height:40px}.top .badge{font-size:11px;padding:3px 8px}}
#colbtn{display:none}.posbar{left:12px;right:12px;width:auto}
@media (min-width:1024px){#colbtn{display:grid}.posbar{display:none}}
@media (max-width:480px){.btn{white-space:normal;line-height:1.2}}
